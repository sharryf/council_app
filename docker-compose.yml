# Council App on a single Ubuntu VPS: the app (FrankenPHP: PHP + web server +
# automatic HTTPS) and MySQL, each in its own container.
#
# First-time setup (on the server, in a clone of this repo):
#   1. sudo bash docker/setup-vps.sh        # installs Docker, firewall, swap
#   2. cp .env.docker.example .env          # then edit it: domain, passwords, APP_KEY
#   3. docker compose up -d --build         # first build takes several minutes
#   4. docker compose logs -f app           # watch it start; Ctrl+C to stop watching
#
# Updating later:
#   git pull && docker compose up -d --build
#
# Moving your existing data (after step 3):
#   Database: docker compose exec -T db sh -c 'exec mysql -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' < council_app.sql
#   Files:    docker compose cp ./storage-app/. app:/app/storage/app/
#             (copy from your PC first; then: docker compose exec -u root app chown -R appuser:appuser /app/storage)
#
# Nightly backups: see docker/backup.sh.

name: council-app

services:
  app:
    build: .
    image: council-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Your domain (gets an automatic HTTPS certificate), or ":80" for plain
      # HTTP while testing by IP address.
      SERVER_NAME: ${SERVER_NAME:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    # Chrome (PDF exports) crashes on large pages with Docker's default 64 MB.
    shm_size: 512m
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    # Not published to the internet: only the app container can reach it.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
      - --max-connections=50
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  storage:
  db_data:
  caddy_data:
  caddy_config:
